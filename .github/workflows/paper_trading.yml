name: 模拟盘日报

# 由 cron-job.org 每天18:10北京时间触发（与实盘日报18:04错开, 避开数据抓取高峰）
# 模拟盘与实盘完全隔离: 只读写 portfolio_paper.json / report_paper_*.json, 不触碰实盘持仓
# GitHub Actions 无状态 → 模拟盘状态靠 git 提交回推持久化（.gitignore 已放行 !report_paper_*.json）
on:
  workflow_dispatch:

# 防止并发运行导致 git push 冲突
concurrency:
  group: paper-trading
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  paper-run:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 设置Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: pip install -r quant_system/requirements.txt

      # 8/14: K线缓存上云 — 模拟盘与实盘共享kline_cache(增量跨job复用)
      - name: 恢复K线缓存
        uses: actions/cache@v4
        with:
          path: quant_system/kline_cache
          key: paper-kline-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            paper-kline-cache-${{ runner.os }}-

      - name: 拉取最新状态（仅快进，拒绝合并冲突）
        run: |
          git pull origin main --ff-only || {
            echo "git pull --ff-only 失败，可能存在远程冲突。"
            echo "请手动检查后重新触发。"
            exit 1
          }

      - name: 运行模拟盘
        env:
          TZ: Asia/Shanghai
          QQMAIL_AUTH_CODE: ${{ secrets.QQMAIL_AUTH_CODE }}
        run: |
          echo "===== 模拟盘开始: $(date '+%Y-%m-%d %H:%M') ====="
          cd quant_system && python paper_trading.py 2>&1
          echo "===== 模拟盘完成: $(date '+%Y-%m-%d %H:%M') ====="

      - name: 生成监控站 manifest + 提交模拟盘状态
        env:
          TZ: Asia/Shanghai
        run: |
          # 1) 同步数据到站点目录并生成 manifest
          #    Pages 从 /docs 发布只含 docs/ 内容 → 数据文件必须复制进 docs/data/
          cd quant_system
          python - <<'EOF'
          import json, glob, os, shutil
          os.makedirs('../docs/data', exist_ok=True)
          for f in sorted(glob.glob('report_paper_*.json')) + ['portfolio_paper.json']:
              if os.path.exists(f):
                  shutil.copy(f, os.path.join('../docs/data', f))
          reports = []
          for f in sorted(glob.glob('report_paper_*.json')):
              try:
                  d = json.load(open(f, encoding='utf-8'))
              except Exception:
                  continue
              b = d.get('benchmark', {}) or {}
              reports.append({
                  'date': str(d.get('date') or os.path.basename(f)[13:21]),
                  'file': f'data/{os.path.basename(f)}',   # 相对站点根(docs/)
                  'updated_at': str(d.get('timestamp') or ''),
                  'total_assets': d.get('account', {}).get('total_assets', 0),
                  'total_return_pct': d.get('account', {}).get('total_return_pct', 0),
                  'benchmark_return': round((b.get('benchmark_return') or 0) * 100, 2),
                  'excess_return': round((b.get('excess_return') or 0) * 100, 2),
                  'beat_benchmark': bool(b.get('beat_benchmark', False)),
                  'stale': ','.join(d.get('stale_codes') or []),  # 8/19: 数据滞后标记(网站显示告警+曲线过滤)
              })
          json.dump({'reports': reports}, open('../docs/data/reports.json', 'w', encoding='utf-8'),
                    ensure_ascii=False, indent=1)
          print(f"[manifest] docs/data/ 已同步 {len(reports)} 份报告 + 账户状态")
          EOF

          # 2) 状态变更检测 (从仓库根跑, 覆盖 portfolio/报告/manifest/站点数据)
          cd "$GITHUB_WORKSPACE"
          if git diff --quiet -- quant_system/portfolio_paper.json docs/data/ && \
             [ -z "$(git ls-files --others --exclude-standard quant_system/portfolio_paper.json quant_system/report_paper_*.json docs/data/)" ]; then
            echo "状态未变更，跳过提交"
            exit 0
          fi

          echo "检测到模拟盘状态更新，提交变更..."
          git config user.name "Quant Paper Bot"
          git config user.email "paper-bot@github.com"

          DATE=$(date '+%Y%m%d')
          NAV=$(python -c "import json,glob; fs=sorted(glob.glob('quant_system/report_paper_*.json')); d=json.load(open(fs[-1],encoding='utf-8')) if fs else {}; print(d.get('account',{}).get('total_assets',0))" 2>/dev/null || echo 0)
          RET=$(python -c "import json,glob; fs=sorted(glob.glob('quant_system/report_paper_*.json')); d=json.load(open(fs[-1],encoding='utf-8')) if fs else {}; print(d.get('account',{}).get('total_return_pct',0))" 2>/dev/null || echo 0)
          # 8/19加固: 数据滞后时提交信息带[STALE]标记(可审计, 网站据此过滤曲线)
          STALE=$(python -c "import json,glob; fs=sorted(glob.glob('quant_system/report_paper_*.json')); d=json.load(open(fs[-1],encoding='utf-8')) if fs else {}; sc=d.get('stale_codes') or []; print('['+','.join(sc)+']' if sc else '')" 2>/dev/null || echo "")

          git add quant_system/portfolio_paper.json quant_system/report_paper_*.json docs/data/
          git commit -m "paper(trade): 模拟盘日报 ${DATE} 净值${NAV} 累计${RET}% ${STALE}"

          git push origin HEAD || {
            echo "push失败，rebase重试一次"
            git pull --rebase || exit 1
            git push origin HEAD || exit 1
          }
          echo "模拟盘状态已推送 ✓"

      - name: 上传模拟盘报告（可选，留作存档）
        uses: actions/upload-artifact@v4
        with:
          name: paper-report-${{ github.run_id }}
          path: quant_system/report_paper_*.json
          retention-days: 7
