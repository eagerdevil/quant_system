name: 每日A股量化分析

on:
  workflow_dispatch:

concurrency:
  group: daily-quant
  cancel-in-progress: false

jobs:
  quant-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: pip install -r quant_system/requirements.txt

      # 8/14: K线缓存上云 — 增量缓存跨job复用, 避免每天全量重拉(东财WAF 707风暴)
      - name: 恢复K线缓存
        uses: actions/cache@v4
        with:
          path: quant_system/kline_cache
          key: kline-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            kline-cache-${{ runner.os }}-

      - name: 恢复回测缓存
        uses: actions/cache@v4
        with:
          path: quant_system/backtest_cache
          key: backtest-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            backtest-cache-${{ runner.os }}-

      - name: 运行量化模型
        env:
          TZ: Asia/Shanghai
          QQMAIL_AUTH_CODE: ${{ secrets.QQMAIL_AUTH_CODE }}
        run: |
          echo "===== 开始运行: $(date '+%Y-%m-%d %H:%M') ====="
          cd quant_system && python daily_runner.py 2>&1
          echo "===== 运行完成: $(date '+%Y-%m-%d %H:%M') ====="

      # 8/14: 实盘历史云端留存 — 报告+账户状态自动commit+push
      # 8/15修复: .gitignore有report_*.json规则, git ls-files --others 会把新报告当ignored过滤掉,
      #          导致该步骤永远走"跳过"分支(云上留存从未生效) → 改用 git add -f 强制+staged diff判断
      - name: 提交实盘状态到云端
        run: |
          git config user.name "Quant Bot"
          git config user.email "quant-bot@github.com"
          git add -f quant_system/report_*.json quant_system/portfolio.json
          if git diff --cached --quiet; then
            echo "状态未变更，跳过提交"
            exit 0
          fi
          DATE=$(date '+%Y%m%d')
          git commit -m "quant(report): 实盘日报 ${DATE}"
          git push origin HEAD || {
            git pull --rebase || exit 1
            git push origin HEAD || exit 1
          }
          echo "实盘状态已推送 ✓"

      - name: 上传报告（可选，留作存档）
        uses: actions/upload-artifact@v4
        with:
          name: quant-report-${{ github.run_id }}
          path: quant_system/report_*.json
          retention-days: 7
