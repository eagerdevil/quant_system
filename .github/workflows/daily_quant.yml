name: 每日A股量化分析

on:
  workflow_dispatch:

concurrency:
  group: daily-quant
  cancel-in-progress: false

jobs:
  quant-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: pip install -r quant_system/requirements.txt

      - name: 运行量化模型
        env:
          TZ: Asia/Shanghai
          QQMAIL_AUTH_CODE: ${{ secrets.QQMAIL_AUTH_CODE }}
        run: |
          echo "===== 开始运行: $(date '+%Y-%m-%d %H:%M') ====="
          cd quant_system && python daily_runner.py 2>&1
          echo "===== 运行完成: $(date '+%Y-%m-%d %H:%M') ====="

      - name: 上传报告（可选，留作存档）
        uses: actions/upload-artifact@v4
        with:
          name: quant-report-${{ github.run_id }}
          path: quant_system/report_*.json
          retention-days: 7
