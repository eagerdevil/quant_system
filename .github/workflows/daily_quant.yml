name: 每日A股量化分析

# 由 cron-job.org 外部触发（周一至周五 17:07 北京时间）
# 也可手动触发
on:
  workflow_dispatch:

jobs:
  quant-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖（仅标准库，跳过）
        run: echo "所有依赖均为Python标准库，无需安装"

      - name: 运行量化模型
        env:
          TZ: Asia/Shanghai
          QQMAIL_AUTH_CODE: ${{ secrets.QQMAIL_AUTH_CODE }}
        run: |
          echo "===== 开始运行: $(date '+%Y-%m-%d %H:%M') ====="
          python daily_runner.py --email-pw "$QQMAIL_AUTH_CODE" 2>&1
          echo "===== 运行完成: $(date '+%Y-%m-%d %H:%M') ====="

      - name: 上传报告（可选，留作存档）
        uses: actions/upload-artifact@v4
        with:
          name: quant-report-${{ github.run_id }}
          path: report_*.json
          retention-days: 7
