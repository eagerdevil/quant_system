name: 每周因子权重优化

# 每周日 UTC 09:00 = 北京时间 17:00 自动运行
# 回测历史数据 → 搜索最优因子权重 → 自动提交
on:
  schedule:
    - cron: '0 9 * * 0'
  # 也支持手动触发
  workflow_dispatch:

# 需要写权限以提交权重更新
permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          # 使用内置 token，推送不会触发新的 workflow
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 设置Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 运行参数优化
        env:
          TZ: Asia/Shanghai
        run: |
          echo "===== 每周因子优化: $(date '+%Y-%m-%d %H:%M') ====="
          python optimizer.py 2>&1
          echo "===== 优化完成: $(date '+%Y-%m-%d %H:%M') ====="

      - name: 提交权重更新
        env:
          TZ: Asia/Shanghai
        run: |
          # 检查是否有变更
          if git diff --quiet factor_weights.json && git diff --quiet --cached factor_weights.json; then
            echo "权重未变更，跳过提交"
            exit 0
          fi

          echo "检测到权重更新，提交变更..."
          git config user.name "Quant Optimizer Bot"
          git config user.email "quant-bot@github.com"

          # 获取本次优化IC
          IC=$(python -c "import json; c=json.load(open('factor_weights.json','r',encoding='utf-8')); print(c['meta']['ic_score'])")
          VER=$(python -c "import json; c=json.load(open('factor_weights.json','r',encoding='utf-8')); print(c['meta']['version'])")

          git add factor_weights.json
          git commit -m "optimize: 第${VER}次因子权重优化 IC=${IC}

          每周自动优化 — 回测驱动参数搜索
          Co-Authored-By: Quant Optimizer Bot <quant-bot@github.com>"

          git push origin HEAD

          echo "权重更新已推送 ✓"

      - name: 上传优化报告
        uses: actions/upload-artifact@v4
        with:
          name: optimize-result-${{ github.run_id }}
          path: |
            factor_weights.json
            optimize_result_*.json
          retention-days: 30
