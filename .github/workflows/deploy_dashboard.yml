name: 部署仪表盘到GitHub Pages

# 手动触发 — 本地跑完回测后，将仪表盘推送到简历主页
on:
  workflow_dispatch:
  # 也可以每天跑完量化分析后自动部署
  # schedule:
  #   - cron: '30 9 * * 1-5'

jobs:
  deploy-dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 检出量化系统代码
        uses: actions/checkout@v4
        with:
          path: quant-system

      - name: 检出GitHub Pages仓库
        uses: actions/checkout@v4
        with:
          repository: eagerdevil/eagerdevil.github.io
          token: ${{ secrets.PAGES_DEPLOY_TOKEN }}
          path: pages-repo

      - name: 检查仪表盘文件
        id: check
        run: |
          if [ -f quant-system/quant_system/deploy/index.html ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "仪表盘文件存在，准备部署"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "警告: 仪表盘文件不存在，请先本地运行 python daily_runner.py --backtest"
          fi

      - name: 部署仪表盘到Pages
        if: steps.check.outputs.exists == 'true'
        run: |
          mkdir -p pages-repo/quant
          cp quant-system/quant_system/deploy/index.html pages-repo/quant/index.html
          cd pages-repo
          git config user.name "Quant Bot"
          git config user.email "quant-bot@eagerdevil.github.io"
          git add quant/index.html
          if git diff --staged --quiet; then
            echo "仪表盘无变化，跳过提交"
          else
            git commit -m "更新量化仪表盘 $(date '+%Y-%m-%d')"
            git push
            echo "仪表盘已部署到 https://eagerdevil.github.io/quant/"
          fi
