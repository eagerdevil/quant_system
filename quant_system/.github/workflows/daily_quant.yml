name: 每日A股量化分析

# 由 cron-job.org 外部触发（周一至周五 17:07 北京时间）
# 也可手动触发
on:
  workflow_dispatch:

# 防止并发运行（同一时间只允许一个分析任务）
concurrency:
  group: daily-quant
  cancel-in-progress: false

jobs:
  quant-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: pip install -r requirements.txt

      # 8/14: K线缓存上云 — 增量缓存跨job复用, 避免每天全量重拉(东财WAF 707风暴)
      - name: 恢复K线缓存
        uses: actions/cache@v4
        with:
          path: quant_system/kline_cache
          key: kline-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            kline-cache-${{ runner.os }}-

      - name: 恢复回测缓存
        uses: actions/cache@v4
        with:
          path: quant_system/backtest_cache
          key: backtest-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            backtest-cache-${{ runner.os }}-

      - name: 运行量化模型
        env:
          TZ: Asia/Shanghai
          QQMAIL_AUTH_CODE: ${{ secrets.QQMAIL_AUTH_CODE }}
        run: |
          echo "===== 开始运行: $(date '+%Y-%m-%d %H:%M') ====="
          python daily_runner.py 2>&1
          echo "===== 运行完成: $(date '+%Y-%m-%d %H:%M') ====="

      - name: 上传报告（可选，留作存档）
        uses: actions/upload-artifact@v4
        with:
          name: quant-report-${{ github.run_id }}
          path: report_*.json
          retention-days: 7
